name: llm_learn
description: 从课程官方资源到逐字稿、讲义解读、博客与 PDF 的个人学习知识库
owner:
  id: romanrose
  name: ljy
site:
  title: llm_learn
  lang: zh-CN
  base: /llm_learn/
  repository: https://github.com/Romanrose/llm_learn
categories:
  - id: llm
    title: 大模型
    description: 语言模型原理、训练、评估与推理
  - id: agent
    title: 智能体
    description: Agent 架构、记忆、工具使用与工程实践
  - id: infra
    title: AI Infra
    description: GPU、分布式系统、网络与开发环境
  - id: papers
    title: 论文
    description: 经典论文精读、复现与扩展阅读
  - id: product
    title: 产品管理
    description: 从用户需求与产品定位，到假设验证、产品分析和团队协作。接入当前在线系列的五门子课程；官方未标更新年份，视频与练习权限以 Coursera 为准。
  - id: software-engineering
    title: 软件工程
    description: 以 TypeScript 学习规格、测试、抽象、代码审查与并发。接入 Spring 2026 官方十九篇核心阅读与作业入口；尚未确认完整公开录像。
  - id: design
    title: 交互与产品设计
    description: 从需求访谈、问题定义到原型与可用性评估。按 Autumn 2026 官方作业总览接入十个项目练习入口；这是作业导航，完整讲座目录与公开视频待核实。
