  - id: lecture-05
    order: 5
    date: Mon April 13
    title: GPUs, TPUs
    subtitle: 从硬件视角理解 GPU 与 TPU 的执行方式，以及它们如何影响大模型训练效率。
    overview: 本讲从线程、Warp、Block、SM 和存储层次解释 GPU 的执行模型，并对照 TPU 的矩阵计算与互联设计。随后用低精度、算子融合、重计算、访存合并和分块等方法分析性能瓶颈，最后以 FlashAttention 展示如何把硬件约束转化为更高效的算法。
