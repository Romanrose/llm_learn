  - id: lecture-17
    order: 17
    date: Wed May 27
    title: Alignment - multimodality
    subtitle: 讨论模型对齐与多模态扩展，理解语言模型如何连接图像等其他信息形式。
    overview: 本讲研究如何把预训练语言模型扩展为视觉语言模型：先用 CLIP 式对比学习对齐图像与文本表示，再比较冻结编码器、投影层、交叉注意力和端到端训练等连接方案。课程结合 Flamingo、LLaVA 等模型讨论多模态指令数据、分辨率、视觉 Token 与语言能力保持之间的取舍。
