  - id: lecture-01
    order: 1
    date: Mon March 30
    title: Overview, tokenization
    subtitle: 建立从数据到语言模型的课程全景，并理解分词器如何把文本转换为模型可处理的表示。
    overview: 本讲从“如何在固定资源下训练出更好的语言模型”出发，串起数据、模型架构、系统、Scaling Laws 与对齐等课程主线。后半部分聚焦文本表示：比较字符、字节、词级切分的局限，并通过 BPE 理解词表大小、压缩率、可逆性和多语言处理之间的取舍。
