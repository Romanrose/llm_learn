  - id: lecture-07
    order: 7
    date: Mon April 20
    title: Parallelism
    subtitle: 介绍大模型训练中的并行基础，以及计算任务如何跨多张加速卡进行拆分与协同。
    overview: 本讲先把单卡训练扩展到多卡环境，建立带宽、延迟、拓扑和集合通信的基本模型。通过 broadcast、reduce、all-reduce、all-gather 与 reduce-scatter，理解数据并行如何同步梯度，以及通信量、计算重叠和互联结构如何决定扩展效率。
