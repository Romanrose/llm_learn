  - id: lecture-02
    order: 2
    date: Wed April 1
    title: PyTorch (einops), resource accounting (FLOPs, memory, arithmetic intensity)
    subtitle: 用张量操作、FLOPs、显存和算术强度建立训练大模型前最基本的资源核算方法。
    overview: 本讲建立训练系统分析所需的统一语言：先用 PyTorch 与 einops 表达张量计算，再计算参数量、FLOPs、激活与优化器显存。课程进一步引入算术强度和 Roofline Model，用来判断一个算子究竟受计算吞吐限制，还是受显存带宽限制，并据此估算 Transformer 训练成本。
