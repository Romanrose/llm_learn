    overview: 本讲解释基础模型如何通过 Mid-training、监督微调和偏好优化获得指令遵循、对话与安全行为。课程重点比较示范数据与偏好数据的采集方式，并从目标函数和工程复杂度上对照 PPO 与 DPO，同时提醒标注者分布、回答长度和模型生成反馈会改变最终行为。
