  - id: lecture-04
    order: 4
    date: Wed April 8
    title: Attention alternatives and mixture of experts
    subtitle: 比较注意力替代方案与混合专家模型，分析它们在计算效率和模型容量上的取舍。
    overview: 本讲讨论两条扩大模型能力的路线：用线性注意力、状态空间模型等结构降低长序列计算成本，以及用 Mixture of Experts 在近似固定 FLOPs 下增加参数容量。课程会拆解专家路由、负载均衡、容量溢出和通信开销，说明稀疏模型的算法收益为何必须与系统实现共同考虑。
