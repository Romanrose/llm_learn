  - id: lecture-16
    order: 16
    date: Wed May 20
    title: Post-training - RLVR
    subtitle: 聚焦可验证奖励强化学习，理解 RLVR 的训练信号、优化流程与适用任务。
    overview: 本讲从 PPO 的策略梯度、价值模型和 KL 约束出发，引出更适合可验证任务的 GRPO 与相关变体。通过 DeepSeek-R1、DeepSeekMath、Kimi 等案例，课程分析正确性奖励、组内基线、长思维链涌现、SFT 冷启动和奖励投机，说明 RLVR 能扩展什么、又不能替代什么。
