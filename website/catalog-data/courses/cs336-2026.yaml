    title: Kernels, Triton
    subtitle: 进入 GPU Kernel 与 Triton 编程，理解算子实现、内存访问和性能优化的基本方法。
    overview: 本讲把上一讲的硬件直觉落到算子实现：学习如何建立正确的 benchmark、使用 profiler 定位瓶颈，并从访存、并行粒度和融合机会分析 Kernel。随后用 Triton 编写向量加法、Softmax 和矩阵乘等算子，理解 program、block、mask、tiling 与自动调优的配合方式。
