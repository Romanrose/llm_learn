  - id: lecture-08
    order: 8
    date: Wed April 22
    title: Parallelism
    subtitle: 继续分析数据、张量和流水线并行，并理解通信成本对分布式训练效率的影响。
    overview: 本讲系统比较大模型训练的组合并行策略：从 ZeRO/FSDP 分片参数、梯度和优化器状态，到张量并行、流水线并行、序列并行与上下文并行。重点是根据模型规模、批量大小、节点拓扑和显存预算计算通信代价，并理解为何生产训练通常需要多种并行方式组成 3D 或 4D 并行。
