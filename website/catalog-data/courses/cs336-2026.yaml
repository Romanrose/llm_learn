  - id: lecture-03
    order: 3
    date: Mon April 6
    title: Architectures, hyperparameters
    subtitle: 理解 Transformer 架构的关键选择，以及模型规模、深度和训练超参数之间的关系。
    overview: 本讲以现代 Transformer 的共同骨架为起点，比较 RMSNorm、SwiGLU、RoPE、串并联子层和去偏置等常见设计。重点不只是罗列模型差异，而是理解这些选择为何在内存访问、优化稳定性和规模扩展中有效，并形成选择层数、宽度、头数、词表和正则化策略的经验框架。
