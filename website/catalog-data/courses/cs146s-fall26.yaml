learningModules:
  - id: references
    title: 00 · 课程参考资料
    description: 官方来源、作业入口与访问说明。
    from: 0
    to: 0
  - id: week-01
    title: "Week 1: The Internals of Coding Agents"
    description: What an LLM actually is, and what the agent loop looks like under the hood；The core tool set
      (read, write, edit, bash) and how tasks flow through it；How production coding agents structure their
      system prompts and tool definitions
    from: 1
    to: 2
  - id: week-02
    title: "Week 2: Advanced Context Engineering"
    description: "Advanced prompting techniques and when each applies；RePPIT (Research, Propose, Plan, Implement,
      Test) and spec-driven development；MCP fundamentals: servers, clients, tools, and transport；Designing
      tools for agent ergonomics"
    from: 3
    to: 4
  - id: week-03
    title: "Week 3: Agent Skills and CLI"
    description: What skills are and how SKILL.md + scripts encode a workflow；Web skills and extending agent
      capability beyond the repo；Working effectively from the CLI
    from: 5
    to: 6
  - id: week-04
    title: "Week 4: Customizing Your Agent and Repository"
    description: "CLAUDE.md and AGENTS.md: what to put where；Hooks for lint gates, test runs, and
      guardrails；Subagent patterns (planner / implementer / reviewer)"
    from: 7
    to: 8
  - id: week-05
    title: "Week 5: Agent-Ready Codebases"
    description: "What makes a repo agent-ready: structure, docs, tests, and checks；Scoring and auditing
      readiness；Common gaps that block agents in real repos"
    from: 9
    to: 10
  - id: week-06
    title: "Week 6: Agentic Code Review"
    description: What AI review catches well, and what it misses；Review architectures and custom rules；Fitting AI
      review into a team's PR workflow
    from: 11
    to: 12
  - id: week-07
    title: "Week 7: Security"
    description: SAST / SCA, dependency and secret-leak vulnerabilities；Prompt injection and agent-specific attack
      surfaces；Agent-assisted triage and remediation
    from: 13
    to: 14
  - id: week-08
    title: "Week 8: Background Agents"
    description: Async, cloud-delegated agents；Managing fleets of parallel agents；Issue-to-PR pipelines and
      triggers (Slack, Linear, GitHub)
    from: 15
    to: 16
  - id: week-09
    title: "Week 9: Building an AI-Native Team"
    description: MCP portals and centralized, permissioned tool access；LLM gateways, model routing, and cost
      optimization；Org-wide adoption patterns
    from: 17
    to: 18
  - id: week-10
    title: "Week 10: The Software Factory + The Future"
    description: Self-running, self-improving software systems；Running and securing agents post-deployment；Where
      AI software engineering goes next
    from: 19
    to: 20
